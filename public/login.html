<!doctype html>
<!-- Served without a login session (see middleware.js), so it holds nothing private:
     no app code, no shop data. It only talks to /api/auth. -->
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f3ff" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kirana Bill · Login</title>
    <style>
      :root {
        --bg: #f5f3ff;
        --card: #ffffff;
        --text: #18181b;
        --muted: #71717a;
        --line: #e4e4e7;
        --soft: #f4f4f5;
        --brand: #7c3aed;
        --brand-2: #4f46e5;
        --error: #e11d48;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: radial-gradient(circle at 20% 10%, #ddd6fe 0, transparent 45%),
          radial-gradient(circle at 90% 80%, #e0e7ff 0, transparent 45%), var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border-radius: 28px;
        padding: 28px 22px 22px;
        box-shadow: 0 20px 60px -20px rgb(76 29 149 / 0.35);
      }
      .head { text-align: center; }
      .badge {
        width: 60px;
        height: 60px;
        margin: 0 auto 14px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        box-shadow: 0 12px 30px -10px rgb(124 58 237 / 0.6);
      }
      h1 { margin: 0; font-size: 22px; }
      p.sub { margin: 6px 0 20px; color: var(--muted); font-size: 14px; }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px;
        margin-bottom: 18px;
        background: var(--soft);
        border-radius: 14px;
      }
      .tabs button {
        padding: 10px;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      .tabs button[aria-selected='true'] { color: var(--text); background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 0.1); }
      label { display: block; margin: 12px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; color: var(--muted); text-transform: uppercase; }
      input {
        width: 100%;
        padding: 12px 14px;
        font: inherit;
        font-size: 16px;
        color: var(--text);
        background: #fff;
        border: 1.5px solid var(--line);
        border-radius: 14px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgb(124 58 237 / 0.15); }
      .pw { position: relative; }
      .pw input { padding-right: 64px; }
      .pw button {
        position: absolute;
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
        padding: 6px 10px;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        color: var(--brand);
        background: none;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      .hint { margin: 6px 2px 0; font-size: 12px; color: var(--muted); }
      [hidden] { display: none !important; }
      .submit {
        width: 100%;
        margin-top: 20px;
        padding: 15px;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        color: #fff;
        border: 0;
        border-radius: 16px;
        background: linear-gradient(90deg, var(--brand), var(--brand-2));
        box-shadow: 0 10px 24px -10px rgb(124 58 237 / 0.7);
        cursor: pointer;
      }
      .submit:disabled { opacity: 0.6; cursor: default; }
      .error { min-height: 20px; margin: 12px 0 0; color: var(--error); font-size: 14px; font-weight: 600; text-align: center; }
      .card.shake { animation: shake 0.35s; }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
      }
    </style>
  </head>
  <body>
    <form class="card" id="form" novalidate>
      <div class="head">
        <div class="badge" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" /><path d="M8 7h8" /><path d="M8 11h8" /><path d="M8 15h5" />
          </svg>
        </div>
        <h1>Kirana Bill</h1>
        <p class="sub" id="sub">Apne account se login karein</p>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" aria-selected="true">Login</button>
        <button type="button" role="tab" id="tab-signup" aria-selected="false">Naya account</button>
      </div>

      <div id="name-row" hidden>
        <label for="name">Aapka naam</label>
        <input id="name" name="name" autocomplete="name" maxlength="80" placeholder="e.g. Akhlaque Ahmad" />
      </div>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="aap@example.com" required />

      <label for="password">Password</label>
      <div class="pw">
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="button" id="show" aria-label="Password dikhayein">Dikhao</button>
      </div>
      <p class="hint" id="pw-hint" hidden>Kam se kam 8 akshar</p>

      <div id="code-row" hidden>
        <label for="code">Signup code</label>
        <input id="code" name="code" autocomplete="off" autocapitalize="none" placeholder="Jo code aapko diya gaya hai" />
      </div>

      <button class="submit" id="go" type="submit">Login</button>
      <p class="error" id="error" role="alert"></p>
    </form>

    <script>
      const $ = (id) => document.getElementById(id)
      const form = $('form')
      const go = $('go')
      const error = $('error')
      // Only same-site paths, so ?next= can't bounce people to another website
      const raw = new URLSearchParams(location.search).get('next') || '/'
      const nextPath = raw.startsWith('/') && !raw.startsWith('//') ? raw : '/'

      let mode = 'login'
      let needsCode = false

      function setMode(m) {
        mode = m
        const signup = m === 'signup'
        $('tab-login').setAttribute('aria-selected', String(!signup))
        $('tab-signup').setAttribute('aria-selected', String(signup))
        $('name-row').hidden = !signup
        $('pw-hint').hidden = !signup
        $('code-row').hidden = !(signup && needsCode)
        $('password').autocomplete = signup ? 'new-password' : 'current-password'
        $('sub').textContent = signup ? 'Ek minute mein account banayein' : 'Apne account se login karein'
        go.textContent = signup ? 'Account banayein' : 'Login'
        error.textContent = ''
        ;(signup ? $('name') : $('email')).focus()
      }
      $('tab-login').onclick = () => setMode('login')
      $('tab-signup').onclick = () => setMode('signup')
      if (location.hash === '#signup') setMode('signup')

      $('show').onclick = () => {
        const pw = $('password')
        const hide = pw.type === 'text'
        pw.type = hide ? 'password' : 'text'
        $('show').textContent = hide ? 'Dikhao' : 'Chhupao'
      }
      form.addEventListener('input', () => (error.textContent = ''))

      // Already logged in (e.g. opened /login.html again)? Straight to the app.
      fetch('/api/auth')
        .then((r) => r.json())
        .then((d) => {
          if (d.user) return location.replace(nextPath)
          needsCode = !!d.signupNeedsCode
          $('code-row').hidden = !(mode === 'signup' && needsCode)
        })
        .catch(() => {})

      function fail(msg) {
        error.textContent = msg
        form.classList.remove('shake')
        void form.offsetWidth // restart the animation
        form.classList.add('shake')
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        const body = {
          mode,
          email: $('email').value.trim(),
          password: $('password').value,
          name: $('name').value.trim(),
          code: $('code').value.trim(),
        }
        if (mode === 'signup' && !body.name) return fail('Apna naam daalein')
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(body.email)) return fail('Sahi email daalein')
        if (!body.password) return fail('Password daalein')
        if (mode === 'signup' && body.password.length < 8) return fail('Password kam se kam 8 akshar ka rakhein')

        const label = go.textContent
        go.disabled = true
        go.textContent = mode === 'signup' ? 'Account ban raha hai…' : 'Login ho raha hai…'
        try {
          const res = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body),
          })
          const data = await res.json().catch(() => ({}))
          if (res.ok) return location.replace(nextPath)
          fail(data.error || 'Login nahi ho paya')
        } catch {
          fail('Internet check karein')
        }
        go.disabled = false
        go.textContent = label
      })
    </script>
  </body>
</html>
